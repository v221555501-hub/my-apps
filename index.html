'use strict';
function configSave(){
 const f=$('#google-config');if(!f)return;
 if(!f.reportValidity())throw Error('請檢查設定欄位。');
 const data=new FormData(f),rangeStart=String(data.get('rangeStart')||''),rangeEnd=String(data.get('rangeEnd')||'');
 if(!Model.validDate(rangeStart)||!Model.validDate(rangeEnd)||!rangeStart||!rangeEnd||rangeEnd<rangeStart)throw Error('同步起迄日期不正確。');
 write(s=>Object.assign(s.calendar,{clientId:String(data.get('clientId')||'').trim(),rangeStart,rangeEnd,target:String(data.get('target')||''),auto:data.has('auto')}));
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.bucket){filters.bucket=filters.bucket===b.dataset.bucket?'':b.dataset.bucket;view='list';selected='';render();return}
 if(b.dataset.pick){filters[b.dataset.pick]=b.dataset.value;view='list';render();$('#view-title').scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.month){
  const [y,m]=month.split('-').map(Number);month=b.dataset.month==='today'?Model.today().slice(0,7):Model.dateKey(new Date(y,m-1+Number(b.dataset.month),1)).slice(0,7);selected='';render();return;
 }
 if(b.dataset.date){selected=b.dataset.date;render();return}
 const action=b.dataset.act,id=b.dataset.id;
 if(!action)return;
 if(action==='add'||action==='new-date'){openEditor();return}
 if(action==='close'){$('#editor').close();return}
 if(action==='clear'){filters={};selected='';render();return}
 if(action==='edit'){const t=state.tasks.find(t=>t.id===id);if(t)openEditor(t);return}
 run(async()=>{
  if(action==='backup')backup();
  if(action==='restore')$('#import-file').click();
  if(action==='raw')exportJSON({app:APP.id,v2:localStorage.getItem(storageKey),v1:localStorage.getItem(oldKey)},APP.id+'-raw-'+Model.today()+'.json');
  if(action==='toggle')write(s=>{const t=s.tasks.find(t=>t.id===id);if(t){t.completed=!t.completed;t.updated=new Date().toISOString()}});
  if(action==='delete'){
   const t=state.tasks.find(t=>t.id===id);
   if(t&&confirm('只刪除本機「'+t.title+'」？Google 上的事件仍會保留。'))write(s=>s.tasks=s.tasks.filter(t=>t.id!==id));
  }
  if(action==='unlink'&&confirm('解除 Google 關聯？本機任務及 Google 事件都會保留。再次加入可能產生另一筆事件，請先確認。'))write(s=>{const t=s.tasks.find(t=>t.id===id);if(t)t.g=null});
  if(action==='push')await bridge.push(id);
  if(action==='adopt'&&confirm('以 Google 的標題、日期時間、顏色、內容與提醒取代本機欄位？分類、資料夾、聯繫人會保留。建議先備份。'))await bridge.adopt(id);
  if(action==='import-google')bridge.importEvent(b.dataset.cal,b.dataset.event);
  if(action==='connect'){configSave();await bridge.authorize(state.calendar.clientId);render()}
  if(action==='sync'){configSave();await bridge.sync();render()}
  if(action==='disconnect'){bridge.disconnect();render()}
  if(action==='revoke'&&confirm('撤銷此 APP 的 Google 授權？不會刪除任務或行事曆事件。')){await bridge.revoke();render()}
  if(action==='rename-list'){
   const name=prompt('新的'+Model.labels[b.dataset.list]+'名稱',b.dataset.value);
   if(name?.trim()){write(s=>Model.rename(s,b.dataset.list,b.dataset.value,name.trim()));if(filters[b.dataset.list]===b.dataset.value)filters[b.dataset.list]=name.trim();render()}
  }
  if(action==='remove-list'&&confirm('刪除清單名稱「'+b.dataset.value+'」？使用中的名稱會阻止刪除。'))write(s=>Model.removeList(s,b.dataset.list,b.dataset.value));
  if(action==='next'){
   const t=state.tasks.find(t=>t.id===id);
   if(t&&confirm('建立 '+t.next+' 的下次保養任務？')){
    const copy=Model.task({...t,id:Model.uid(),startDate:t.next,endDate:t.next,next:'',completed:false,g:null,title:(t.title.slice(0,150)+'（下次）'),updated:new Date().toISOString()});
    write(s=>s.tasks.push(copy));
   }
  }
 });
});

   const data=new FormData(f),old=state.tasks.find(t=>t.id===editId),draft={...(old||Model.blank())};
   for(const k of ['title',...Model.lists,'contact','startDate','startTime','endDate','endTime','reminderValue','reminderUnit','color','notes','next','cost'])if(data.has(k))draft[k]=String(data.get(k)).trim();
   draft.allDay=data.has('allDay');draft.completed=data.has('completed');draft.reminderDefault=data.has('reminderDefault');
   if(draft.allDay){draft.startTime='';draft.endTime=''}
   draft.updated=new Date().toISOString();if(draft.g)draft.g={...draft.g,dirty:true};
   const t=Model.task(draft);
   write(s=>{
    if(editId){const prev=s.tasks.find(t=>t.id===editId);if(!prev||prev.updated!==editStamp)throw Error('此任務已被其他分頁或同步修改。請關閉視窗後重新編輯。');s.tasks=s.tasks.map(r=>r.id===editId?t:r)}
    else s.tasks.push(t);
    for(const k of Model.lists)if(t[k]&&!s.lists[k].includes(t[k]))s.lists[k].push(t[k]);
   });
   $('#editor').close();toast('任務已儲存；需要 Google 提醒時，按任務卡的「一鍵加入／更新 Google 行事曆」。');
  }catch(err){$('#form-error').textContent=err.message}
 }else if(e.target.matches('.list-add')){
  e.preventDefault();const f=e.target,k=f.dataset.list,name=f.elements.name.value.trim();
  run(()=>{if(!name)throw Error('請填名稱。');if(state.lists[k].includes(name))throw Error('名稱已存在。');write(s=>s.lists[k].push(name))});
 }else if(e.target.id==='google-config'){e.preventDefault();run(()=>{configSave();toast('Google 連線設定已儲存。')})}
 else if(e.target.id==='subscribe'){e.preventDefault();const id=e.target.elements.calendarId.value;run(()=>bridge.subscribe(id))}
});
$('#import-file').onchange=async e=>{
 const file=e.target.files[0];e.target.value='';if(!file)return;
 try{
  if(file.size>10*1024*1024)throw Error('備份超過 10 MB。');
  const data=JSON.parse(await file.text());
  if(data.app!==APP.id)throw Error('這是另一套 APP 的備份，B 與 C 不能混用。');
  const imported=data.version===2?Model.validate(data.state):data.version===1?Model.migrate(data.items):null;
  if(!imported)throw Error('不支援此備份版本。');
  imported.remote=Model.fresh().remote;
  if(confirm('以備份的 '+imported.tasks.length+' 筆任務覆蓋目前 '+state.tasks.length+' 筆與手動清單？請先備份。')){
   write(s=>Object.assign(s,imported));bridge.disconnect();render();toast('備份已還原；Google 需重新授權。');
  }
 }catch(err){toast('未還原：'+err.message)}
};
window.addEventListener('storage',e=>{if(e.key===storageKey){load();render();toast('另一分頁已更新資料。')}});
setInterval(()=>{if(!document.hidden&&state.calendar.auto&&bridge.active()&&!bridge.busy&&!$('#editor').open)run(()=>bridge.sync())},120000);
setInterval(()=>{if(['list','calendar'].includes(view)&&!$('#editor').open)render(true)},60000);
load();document.body.classList.toggle('community',APP.community);render();

</script></body></html>
